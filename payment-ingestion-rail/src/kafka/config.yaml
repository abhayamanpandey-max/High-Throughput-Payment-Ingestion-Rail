import json
from confluent_kafka import Consumer, KafkaError

print("🔍 Connecting with confluent-kafka engine...")

consumer_config = {
    'bootstrap.servers': 'localhost:9092',
    'group.id': 'verification-group-unique',
    'auto.offset.reset': 'earliest',
    'enable.auto.commit': False
}

consumer = Consumer(consumer_config)
consumer.subscribe(['payment_transactions'])

print("✅ Successfully connected! Scanning the stream for compressed data...\n")

count = 0
try:
    while count < 5:
        msg = consumer.poll(timeout=1.0)
        if msg is None:
            continue
        if msg.error():
            if msg.error().code() != KafkaError._PARTITION_EOF:
                print(f"[-] Kafka Error: {msg.error()}")
            continue

        count += 1
        # Decode the LZ4/UTF-8 string payload
        tx = json.loads(msg.value().decode('utf-8'))
        print(f"[{count}] Decoded Event -> ID: {tx.get('transaction_id')} | Account: {tx.get('account_id')} | Amt: ₹{tx.get('amount')}")

    print("\n🎉 Verification successful! Data is fully confirming inside Kafka.")

except KeyboardInterrupt:
    pass
finally:
    consumer.close()





