version: '3.8'

networks:
  ingestion_network:
    driver: bridge
  analytics_network:
    driver: bridge

services:

  # ============================================================================
  # POSTGRESQL (Airflow metadata backend — not part of payment pipeline)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: payment_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: airflow123
      POSTGRES_DB: airflow_db
    ports:
      - "5432:5432"
    networks:
      - ingestion_network
      - analytics_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # APACHE KAFKA (Event Streaming Bus — KRaft mode, single-broker for dev)
  #
  # Production note: increase to 3 brokers and set:
  #   KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  #   KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  #   KAFKA_MIN_INSYNC_REPLICAS: 2
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: payment_kafka
    ports:
      - "9092:9092"
    networks:
      - ingestion_network
      - analytics_network
    depends_on:
      - postgres
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      # Single-broker dev setting — set to 3 in production
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_REPRODUCTIONS: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # APACHE FLINK JOBMANAGER (Stream Processing)
  # ============================================================================
  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flink_jobmanager
    ports:
      - "8081:8081"
      - "6123:6123"
    volumes:
      - ./src/flink:/opt/flink/usrlib
      - ./src/databricks:/opt/flink/usrlib/databricks
      - ./flink-state/checkpoints:/opt/flink/checkpoints
      - ./flink-state/savepoints:/opt/flink/savepoints
    networks:
      - analytics_network
      - ingestion_network
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2G
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 10 s
    command: jobmanager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # APACHE FLINK TASKMANAGER (Stream Processing Workers)
  # ============================================================================
  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flink_taskmanager
    ports:
      - "6121:6121"
    volumes:
      - ./src/flink:/opt/flink/usrlib
      - ./flink-state/checkpoints:/opt/flink/checkpoints
      - ./flink-state/savepoints:/opt/flink/savepoints
    networks:
      - analytics_network
      - ingestion_network
    depends_on:
      - flink-jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2G
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 10 s
    command: taskmanager
    restart: unless-stopped

  # ============================================================================
  # APACHE AIRFLOW — Webserver + Scheduler (both required for DAGs to run)
  #
  # Previously only the webserver was started; without the scheduler, DAGs
  # are visible in the UI but never actually execute.
  # ============================================================================
  airflow-webserver:
    image: apache/airflow:2.8.0-python3.11
    container_name: payment_airflow_webserver
    ports:
      - "8080:8080"
    networks:
      - analytics_network
      - ingestion_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:airflow123@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_HOME: /opt/airflow
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin 2>/dev/null || true &&
               airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.8.0-python3.11
    container_name: payment_airflow_scheduler
    networks:
      - analytics_network
      - ingestion_network
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:airflow123@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_HOME: /opt/airflow
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: airflow scheduler
    restart: unless-stopped

  # ============================================================================
  # NOTE: Databricks Delta Lake is CLOUD-BASED (not Docker)
  # NOTE: Streamlit runs locally: streamlit run src/dashboard/streamlit_dashboard.py
  # ============================================================================

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local